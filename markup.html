<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Live markup: a transparent, click-through window over the user's screen. Claude's circles, boxes,
     highlights, arrows, numbered steps, notes and freehand lines draw themselves in like a pen, one after
     another, and stay until the app clears them. Any CSS colour works; the four named ones are tuned. -->
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  svg { position: fixed; inset: 0; width: 100%; height: 100%; }
  .ink { fill: none; stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; }
  .glow { fill: none; stroke-width: 12; stroke-linecap: round; stroke-linejoin: round; opacity: .22; filter: blur(3px); }
  .tag { font: 600 15px -apple-system, "SF Pro Text", sans-serif; }
  .note { font: 500 15px/1.35 -apple-system, "SF Pro Text", sans-serif; }
  .num { font: 700 16px -apple-system, "SF Pro Text", sans-serif; }
  g.mark { transition: opacity .6s ease; }
  body.lasso { cursor: crosshair; }
  .dim { fill: rgba(0, 0, 0, .2); transition: opacity .2s; }
  #bar { position: fixed; top: 44px; left: 50%; transform: translateX(-50%); display: none; align-items: center; gap: 6px;
         padding: 6px 6px 6px 16px; border-radius: 22px; background: rgba(20, 22, 26, .94); border: 1px solid rgba(255,255,255,.12);
         box-shadow: 0 12px 34px rgba(0,0,0,.45); font: 500 14px -apple-system, "SF Pro Text", sans-serif; color: #f2f3f5; cursor: default; }
  body.lasso #bar { display: flex; }
  #bar span { margin-right: 8px; white-space: nowrap; }
  #bar button { font: inherit; font-size: 13px; height: 30px; padding: 0 14px; border-radius: 15px; border: 1px solid rgba(255,255,255,.14);
                background: none; color: #c9cdd2; cursor: pointer; }
  #bar button:disabled { opacity: .4; cursor: default; }
  #bar .go { background: #ffd23f; border-color: #ffd23f; color: #1a1405; font-weight: 600; }
  g.mark.gone { opacity: 0; }
  /* Copy text from the screen: drag a box; the rest of the screen dims around it */
  #gbar { position: fixed; top: 44px; left: 50%; transform: translateX(-50%); display: none; align-items: center; gap: 6px;
          padding: 6px 6px 6px 16px; border-radius: 22px; background: rgba(20, 22, 26, .94); border: 1px solid rgba(255,255,255,.12);
          box-shadow: 0 12px 34px rgba(0,0,0,.45); font: 500 14px -apple-system, "SF Pro Text", sans-serif; color: #f2f3f5; cursor: default; }
  #gbar span { margin-right: 8px; white-space: nowrap; }
  #gbar button { font: inherit; font-size: 13px; height: 30px; padding: 0 14px; border-radius: 15px; border: 1px solid rgba(255,255,255,.14);
                 background: none; color: #c9cdd2; cursor: pointer; }
  body.grab { cursor: crosshair; }
  body.grab #bar { display: none; }
  body.grab #gbar { display: flex; }
  body.grab.dragging #gbar { opacity: 0; pointer-events: none; }
  .gbox { fill: none; stroke: #5b9dff; stroke-width: 2; }
  /* Mark up a window: the window under the pointer glows; click it and a prompt box springs out of it */
  #pk { position: fixed; inset: 0; display: none; }
  body.pick #pk { display: block; }
  #pk .glowbox { position: fixed; border-radius: 12px; pointer-events: none; opacity: 0;
    box-shadow: 0 0 0 2px #6CCDE3, 0 0 0 6px rgba(108,205,227,.22), 0 0 40px rgba(108,205,227,.35), 0 0 0 9999px rgba(0,0,0,.3);
    transition: left .22s cubic-bezier(.2,.8,.2,1), top .22s cubic-bezier(.2,.8,.2,1), width .22s cubic-bezier(.2,.8,.2,1),
                height .22s cubic-bezier(.2,.8,.2,1), opacity .2s, box-shadow .3s; }
  #pk .glowbox.on { opacity: 1; }
  #pk.asked .glowbox { box-shadow: 0 0 0 2px #6CCDE3, 0 0 0 6px rgba(108,205,227,.22), 0 0 40px rgba(108,205,227,.35), 0 0 0 9999px rgba(0,0,0,0); }
  #pk.sent .glowbox { opacity: 0; }
  #pk .wtag { position: absolute; left: 10px; top: -32px; background: rgba(20,24,30,.92); border: 1px solid rgba(108,205,227,.4);
    border-radius: 8px; padding: 5px 10px; font: 500 13px -apple-system, "SF Pro Text", sans-serif; color: #dff6fb; white-space: nowrap;
    max-width: 520px; overflow: hidden; text-overflow: ellipsis; }
  #pk .wtag.in { top: 10px; }
  #pk .dimall { position: fixed; inset: 0; background: rgba(0,0,0,.2); transition: opacity .2s; }
  #pk.lit .dimall, #pk.asked .dimall, #pk.sent .dimall { opacity: 0; }
  #pbar { position: fixed; top: 44px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 6px;
    padding: 6px 6px 6px 16px; border-radius: 22px; background: rgba(20, 22, 26, .94); border: 1px solid rgba(255,255,255,.12);
    box-shadow: 0 12px 34px rgba(0,0,0,.45); font: 500 14px -apple-system, "SF Pro Text", sans-serif; color: #f2f3f5; cursor: default; }
  #pbar span { margin-right: 8px; white-space: nowrap; }
  #pbar button { font: inherit; font-size: 13px; height: 30px; padding: 0 14px; border-radius: 15px; border: 1px solid rgba(255,255,255,.14);
    background: none; color: #c9cdd2; cursor: pointer; }
  #pk.asked #pbar, #pk.sent #pbar { display: none; }
  #pask { position: fixed; width: 420px; border-radius: 14px; padding: 12px; color: #eef2f4;
    background: rgba(24,28,34,.96); -webkit-backdrop-filter: blur(18px) saturate(1.4); backdrop-filter: blur(18px) saturate(1.4);
    border: 1px solid rgba(108,205,227,.35); box-shadow: 0 20px 60px rgba(0,0,0,.5); font: 13px -apple-system, "SF Pro Text", sans-serif;
    transform-origin: var(--ox, 50%) var(--oy, 0); transform: scale(.6) translateY(-6px); opacity: 0; pointer-events: none;
    transition: transform .38s cubic-bezier(.2,1.3,.3,1), opacity .2s, width .3s, padding .3s; }
  #pk.asked #pask, #pk.sent #pask { transform: none; opacity: 1; pointer-events: auto; }
  #pask .who { font-size: 12px; color: #8fdcec; margin-bottom: 8px; display: flex; align-items: center; gap: 6px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #pask .who i { width: 8px; height: 8px; border-radius: 50%; background: #6CCDE3; flex: none; }
  #pask textarea { width: 100%; box-sizing: border-box; height: 64px; resize: none; background: #14171c; color: #eef2f4;
    border: 1px solid rgba(255,255,255,.1); border-radius: 9px; padding: 8px 10px; font: inherit; outline: none; }
  #pask textarea:focus { border-color: rgba(108,205,227,.55); }
  #pask .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 2px; }
  #pask .chips button { background: none; border: 1px solid rgba(255,255,255,.14); color: #cfd8dd; border-radius: 7px; padding: 3px 8px;
    font: inherit; font-size: 12px; cursor: pointer; }
  #pask .chips button:hover { border-color: #6CCDE3; color: #fff; }
  #pask .row { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font-size: 11.5px; color: #8d979f; }
  #pask .row div { display: flex; gap: 6px; }
  #pask .row button { font: inherit; font-size: 12.5px; border-radius: 8px; padding: 6px 12px; cursor: pointer;
    background: none; border: 1px solid rgba(255,255,255,.14); color: #c9cdd2; }
  #pask .row .send { background: #0B6E86; border-color: #0B6E86; color: #fff; font-weight: 600; }
  #pask .think { display: none; align-items: center; gap: 8px; color: #bfe9f2; font-size: 13px; padding: 2px; }
  #pk.sent #pask { width: 250px; padding: 9px 12px; pointer-events: none; }
  #pk.sent #pask .who, #pk.sent #pask textarea, #pk.sent #pask .chips, #pk.sent #pask .row { display: none; }
  #pk.sent #pask .think { display: flex; }
  #pk.bye #pask { opacity: 0; transform: scale(.9); }
  .spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(108,205,227,.25); border-top-color: #6CCDE3;
    animation: spin .8s linear infinite; flex: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<svg id="s"></svg>
<div id="bar"><span>Draw on anything you want explained</span>
  <button class="undo">Undo</button><button class="cancel">Cancel</button><button class="go">Explain</button></div>
<div id="gbar"><span>Drag over the text you want</span><button class="cancel">Cancel</button></div>
<div id="pk"><div class="dimall"></div><div class="glowbox"><div class="wtag"></div></div>
  <div id="pbar"><span>Click a window to mark it up</span><button class="cancel">Cancel</button></div>
  <div id="pask"><div class="who"><i></i><span></span></div>
    <textarea placeholder="What should Claude mark?"></textarea>
    <div class="chips"><button>Circle anything odd</button><button data-more>Number the steps to </button><button>Explain each part</button></div>
    <div class="row"><span>Return to send · Esc to close</span><div><button class="cancel">Cancel</button><button class="send">Mark it up</button></div></div>
    <div class="think"><span class="spin"></span><span>Claude is looking at this window…</span></div></div></div>
<script>
const NS = "http://www.w3.org/2000/svg";
const COLORS = { red: "#ff4d4d", yellow: "#ffd23f", green: "#3ecf8e", blue: "#5b9dff", orange: "#ff9233",
                 purple: "#b07cff", pink: "#ff6fae", cyan: "#3fd8e8", white: "#ffffff", black: "#111111" };
const paint = c => COLORS[String(c || "").toLowerCase()] || c || COLORS.red;
// Dark or light text, whichever reads on that colour.
const probe = document.createElement("canvas").getContext("2d");
function textOn(color) {
  probe.clearRect(0, 0, 1, 1); probe.fillStyle = "#000"; probe.fillStyle = color; probe.fillRect(0, 0, 1, 1);
  const [r, g, b] = probe.getImageData(0, 0, 1, 1).data;
  return 0.299 * r + 0.587 * g + 0.114 * b > 150 ? "#111" : "#fff";
}
const svg = document.getElementById("s");

function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  parent && parent.appendChild(e);
  return e;
}
const wob = (a) => (Math.random() - .5) * a;

// A hand-drawn loop around a box: slightly more than one turn, so the ends overlap like a real pen circle.
function loopPath(x, y, w, h) {
  const cx = x + w / 2, cy = y + h / 2, rx = w / 2 + 14, ry = h / 2 + 12, pts = [];
  const start = -2.2 + wob(.4), turns = 1.12;
  for (let i = 0; i <= 64; i++) {
    const t = start + (i / 64) * Math.PI * 2 * turns, k = 1 + .03 * Math.sin(i / 5) + (i / 64) * .05;
    pts.push([cx + Math.cos(t) * rx * k, cy + Math.sin(t) * ry * k]);
  }
  return "M" + pts.map(p => p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" L");
}
function boxPath(x, y, w, h) {
  const p = 8, a = [x - p + wob(3), y - p + wob(3)], b = [x + w + p + wob(3), y - p + wob(3)],
        c = [x + w + p + wob(3), y + h + p + wob(3)], d = [x - p + wob(3), y + h + p + wob(3)];
  return `M${a} L${b} L${c} L${d} Z`;
}
function underlinePath(x, y, w, h) {
  const base = y + h + 6, pts = [];
  for (let i = 0; i <= 24; i++) pts.push([x - 4 + (w + 8) * i / 24, base + Math.sin(i * 1.3) * 2.2]);
  return "M" + pts.map(p => p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" L");
}
function arrowPaths(x1, y1, x2, y2) {
  const mx = (x1 + x2) / 2 - (y2 - y1) * .18, my = (y1 + y2) / 2 + (x2 - x1) * .18;  // a gentle curve
  const ang = Math.atan2(y2 - my, x2 - mx), L = 18;
  const h1 = [x2 - L * Math.cos(ang - .45), y2 - L * Math.sin(ang - .45)], h2 = [x2 - L * Math.cos(ang + .45), y2 - L * Math.sin(ang + .45)];
  return [`M${x1} ${y1} Q${mx} ${my} ${x2} ${y2}`, `M${h1} L${x2} ${y2} L${h2}`];
}

function linePath(x1, y1, x2, y2) { return `M${x1} ${y1} L${x2 + wob(2)} ${y2 + wob(2)}`; }
function strikePath(x, y, w, h) {
  const m = y + h / 2;
  return `M${x - 6} ${m + wob(3)} C${x + w * .3} ${m - 3 + wob(2)} ${x + w * .7} ${m + 3 + wob(2)} ${x + w + 6} ${m + wob(3)}`;
}
function crossPaths(x, y, w, h) { return [`M${x} ${y} L${x + w} ${y + h}`, `M${x + w} ${y} L${x} ${y + h}`]; }
function checkPath(x, y, w, h) { return `M${x} ${y + h * .55} L${x + w * .38} ${y + h} L${x + w} ${y}`; }
function freePath(pts) {  // a smooth line through the points
  if (pts.length < 2) return "";
  let d = `M${pts[0][0]} ${pts[0][1]}`;
  for (let i = 1; i < pts.length - 1; i++) {
    const mx = (pts[i][0] + pts[i + 1][0]) / 2, my = (pts[i][1] + pts[i + 1][1]) / 2;
    d += ` Q${pts[i][0]} ${pts[i][1]} ${mx} ${my}`;
  }
  const last = pts[pts.length - 1];
  return d + ` L${last[0]} ${last[1]}`;
}

function stroke(g, d, color, delay, dur) {
  if (!d) return delay;
  el("path", { d, class: "glow", stroke: color }, g);
  const p = el("path", { d, class: "ink", stroke: color }, g);
  const len = p.getTotalLength();
  for (const q of g.querySelectorAll("path:not([data-done])")) {
    q.dataset.done = 1;
    q.style.strokeDasharray = len; q.style.strokeDashoffset = len;
    q.animate([{ strokeDashoffset: len }, { strokeDashoffset: 0 }], { duration: dur, delay, easing: "cubic-bezier(.3,.1,.3,1)", fill: "forwards" });
  }
  return delay + dur;
}
function appear(node, delay, dy = 6) {
  node.style.opacity = 0;
  node.animate([{ opacity: 0, translate: `0 ${dy}px` }, { opacity: 1, translate: "0 0" }], { duration: 260, delay, fill: "forwards", easing: "ease-out" });
}

function tag(g, text, x, y, color, delay) {
  const t = el("g", {}, g);
  const label = el("text", { x: 12, y: 21, class: "tag", fill: textOn(color) }, t);
  label.textContent = text;
  const w = label.getComputedTextLength() + 24;
  const bx = Math.max(6, Math.min(innerWidth - w - 6, x)), by = Math.max(6, Math.min(innerHeight - 38, y));
  t.insertBefore(el("rect", { width: w, height: 31, rx: 15.5, fill: color }), label);
  t.setAttribute("transform", `translate(${bx} ${by})`);
  appear(t, delay);
}
function note(g, text, x, y, wrap, color, delay) {  // a card of wrapped text
  const t = el("g", {}, g), pad = 12, lh = 20, maxW = Math.max(140, Math.min(wrap || 280, 520));
  const txt = el("text", { class: "note", fill: textOn(color) }, t);
  const lines = [];
  for (const para of String(text).split("\n")) {
    let line = "";
    for (const word of para.split(/\s+/)) {
      const tryLine = line ? line + " " + word : word;
      txt.textContent = tryLine;
      if (txt.getComputedTextLength() > maxW - pad * 2 && line) { lines.push(line); line = word; } else line = tryLine;
    }
    lines.push(line);
  }
  txt.textContent = "";
  let widest = 0;
  lines.forEach((ln, i) => {
    const ts = el("tspan", { x: pad, y: pad + 15 + i * lh }, txt); ts.textContent = ln;
    widest = Math.max(widest, ts.getComputedTextLength());
  });
  const w = widest + pad * 2, h = lines.length * lh + pad * 2 - 4;
  const bx = Math.max(6, Math.min(innerWidth - w - 6, x)), by = Math.max(6, Math.min(innerHeight - h - 6, y));
  t.insertBefore(el("rect", { width: w, height: h, rx: 10, fill: color, opacity: .96 }), txt);
  t.setAttribute("transform", `translate(${bx} ${by})`);
  appear(t, delay);
}

window.draw = marks => {  // they stay until clearMarks(): the app times it
  pickGone();
  clearNow();
  const many = marks.length > 8, gap = many ? 90 : 260, speed = many ? .6 : 1;
  let at = 120;
  // a spotlight goes underneath everything else
  for (const m of marks.filter(m => m.kind === "spotlight")) {
    const g = el("g", { class: "mark" }, svg), x = +m.x, y = +m.y, w = Math.max(+m.w || 0, 20), h = Math.max(+m.h || 0, 20), r = 14, p = 10;
    const hole = `M${x - p + r} ${y - p} H${x + w + p - r} Q${x + w + p} ${y - p} ${x + w + p} ${y - p + r} V${y + h + p - r} Q${x + w + p} ${y + h + p} ${x + w + p - r} ${y + h + p} H${x - p + r} Q${x - p} ${y + h + p} ${x - p} ${y + h + p - r} V${y - p + r} Q${x - p} ${y - p} ${x - p + r} ${y - p} Z`;
    const shade = el("path", { d: `M0 0 H${innerWidth} V${innerHeight} H0 Z ${hole}`, fill: "rgba(0,0,0,.55)", "fill-rule": "evenodd" }, g);
    el("path", { d: hole, fill: "none", stroke: paint(m.color), "stroke-width": 2.5, opacity: .9 }, g);
    shade.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 400, fill: "forwards" });
    if (m.text) tag(g, m.text, x, y - 50, paint(m.color), 300);
  }
  for (const m of marks) {
    if (m.kind === "spotlight") continue;
    const color = paint(m.color), g = el("g", { class: "mark" }, svg);
    const x = +m.x, y = +m.y, w = Math.max(+m.w || 0, 8), h = Math.max(+m.h || 0, 8);
    let end = at, lx = x, ly = y - 44, labelled = true;
    if (m.kind === "circle") end = stroke(g, loopPath(x, y, w, h), color, at, 650 * speed);
    else if (m.kind === "box") end = stroke(g, boxPath(x, y, w, h), color, at, 560 * speed);
    else if (m.kind === "underline") { end = stroke(g, underlinePath(x, y, w, h), color, at, 420 * speed); ly = y + h + 14; }
    else if (m.kind === "strike") end = stroke(g, strikePath(x, y, w, h), color, at, 380 * speed);
    else if (m.kind === "cross") { const [a, b] = crossPaths(x, y, Math.max(w, 24), Math.max(h, 24)); end = stroke(g, a, color, at, 260 * speed); end = stroke(g, b, color, end, 260 * speed); }
    else if (m.kind === "check") end = stroke(g, checkPath(x, y, Math.max(w, 28), Math.max(h, 28)), color, at, 380 * speed);
    else if (m.kind === "line") { end = stroke(g, linePath(x, y, +m.x2, +m.y2), color, at, 420 * speed); lx = x - 10; ly = y - 40; }
    else if (m.kind === "path") end = stroke(g, freePath(m.points || []), color, at, Math.min(1600, 300 + (m.points || []).length * 30) * speed);
    else if (m.kind === "arrow") {
      const [shaft, head] = arrowPaths(x, y, +m.x2, +m.y2);
      end = stroke(g, shaft, color, at, 520 * speed); end = stroke(g, head, color, end - 40, 180);
      lx = x - 10; ly = y - 40;
    } else if (m.kind === "highlight") {  // a highlighter stroke laid down left to right
      const r = el("rect", { x: x - 3, y: y - 2, width: w + 6, height: h + 4, rx: 3, fill: color, opacity: .38 }, g);
      r.style.transformBox = "fill-box"; r.style.transformOrigin = "left center";
      r.animate([{ transform: "scaleX(0)" }, { transform: "scaleX(1)" }], { duration: 380 * speed, delay: at, fill: "both", easing: "ease-out" });
      end = at + 380 * speed;
    } else if (m.kind === "number") {
      const b = el("g", { transform: `translate(${x} ${y})` }, g);
      el("circle", { r: 16, fill: color, stroke: "rgba(0,0,0,.35)", "stroke-width": 1.5 }, b);
      const t = el("text", { class: "num", fill: textOn(color), "text-anchor": "middle", "dominant-baseline": "central" }, b);
      t.textContent = m.text || "•"; labelled = false;
      b.animate([{ opacity: 0, scale: .4 }, { opacity: 1, scale: 1 }], { duration: 280, delay: at, fill: "both", easing: "cubic-bezier(.2,1.4,.4,1)" });
      end = at + 280;
    } else if (m.kind === "note") { note(g, m.text || "", x, y, +m.w, color, at); labelled = false; end = at + 260; }
    else if (m.kind === "label") { ly = y; }
    if (m.text && labelled) tag(g, m.text, lx, ly, color, end - 120);
    at = end + gap;
  }
};


// ---- mark up a window: Tether follows the pointer and sends the window under it (pickHover); a click opens the prompt box
let pickOn = false, pickIdx = 0, pickRect = null;
const pk = document.getElementById("pk"), pglow = pk.querySelector(".glowbox"), ptag = pk.querySelector(".wtag"),
      pask = document.getElementById("pask"), pta = pask.querySelector("textarea");
window.pick = (on, i) => {
  pickOn = on; pickIdx = i || 0; pickRect = null;
  pk.className = ""; pglow.classList.remove("on"); pta.value = "";
  document.body.classList.toggle("pick", on);
};
window.pickHover = r => {
  if (!pickOn || pk.classList.contains("asked")) return;
  pickRect = r;
  pk.classList.toggle("lit", !!r);
  if (!r) { pglow.classList.remove("on"); return; }
  Object.assign(pglow.style, { left: r.x - 3 + "px", top: r.y - 3 + "px", width: r.w + 6 + "px", height: r.h + 6 + "px" });
  ptag.textContent = r.name; ptag.classList.toggle("in", r.y < 40);
  pglow.classList.add("on");
};
const cancelPick = () => { if (pickOn) { window.pick(false); window.pywebview.api.circle_cancel(); } };
pk.querySelectorAll(".cancel").forEach(b => b.onclick = e => { e.stopPropagation(); cancelPick(); });
pk.addEventListener("click", async e => {
  if (!pickOn || pk.classList.contains("asked") || e.target.closest("#pbar") || !pickRect) return;
  const r = pickRect;
  if (!(await window.pywebview.api.window_pick(pickIdx))) return;
  pk.classList.add("asked");
  pask.querySelector(".who span").textContent = r.name;
  // just below the window if there's room, else inside its bottom edge; always on this screen
  const W = innerWidth, H = innerHeight, bw = 420, bh = 160;
  const cx = Math.min(Math.max(r.x + r.w / 2, 40), W - 40);
  const left = Math.min(Math.max(cx - bw / 2, 12), W - bw - 12);
  let top = r.y + r.h + 14;
  if (top + bh > H - 12) top = Math.min(r.y + r.h, H) - bh - 16;
  top = Math.max(12, top);
  pask.style.left = left + "px"; pask.style.top = top + "px";
  pask.style.setProperty("--ox", cx - left + "px"); pask.style.setProperty("--oy", top > r.y + r.h ? "-24px" : "100%");
  setTimeout(() => pta.focus(), 60);
});
pask.querySelectorAll(".chips button").forEach(b => b.onclick = e => {
  e.stopPropagation();
  if (b.dataset.more) { pta.value = b.textContent; pta.focus(); pta.selectionStart = pta.selectionEnd = pta.value.length; return; }
  pta.value = b.textContent; sendPick();
});
function sendPick() {
  if (!pickOn || !pk.classList.contains("asked") || pk.classList.contains("sent")) return;
  pk.classList.add("sent");
  window.pywebview.api.window_ask(pickIdx, pta.value);
}
pask.querySelector(".send").onclick = e => { e.stopPropagation(); sendPick(); };
pta.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); e.stopPropagation(); sendPick(); }
  if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); cancelPick(); }
});
function pickGone() {  // Claude's marks are drawing, or it answered without any: the pill fades out
  if (!pickOn) return;
  pk.classList.add("bye"); pickOn = false;
  setTimeout(() => { if (!pickOn) window.pick(false); }, 260);
}
// ---- draw to ask: the user draws on the screen freehand (as many strokes as they like), then Explain
let lassoOn = false, lassoIdx = 0, drawing = false, strokes = [], cur = null;
const bar = document.getElementById("bar");
window.lasso = (on, i) => {
  if (pickOn) window.pick(false);
  if (!on && grabOn) endGrab();
  clearNow(); lassoOn = on; lassoIdx = i || 0; drawing = false; strokes = [];
  document.body.classList.toggle("lasso", on);
  if (on) el("rect", { class: "dim", x: 0, y: 0, width: "100%", height: "100%" }, svg);
  syncBar();
};
function syncBar() { bar.querySelector(".go").disabled = !strokes.length; bar.querySelector(".undo").disabled = !strokes.length; }
function endLasso() {
  lassoOn = false; drawing = false; document.body.classList.remove("lasso");
  svg.querySelectorAll(".dim").forEach(n => n.remove());
}
window.finishLasso = () => {  // Explain (the button, or Return in the app)
  if (!lassoOn || !strokes.length) return;
  const all = strokes.map(s => s.pts);
  endLasso();
  window.pywebview.api.circle_done(lassoIdx, all);
};
window.cancelLasso = () => { if (lassoOn) { endLasso(); clearNow(); window.pywebview.api.circle_cancel(); } else if (grabOn) cancelGrab(); else if (pickOn && !pk.classList.contains("sent")) cancelPick(); };
bar.querySelector(".go").onclick = finishLasso;
bar.querySelector(".cancel").onclick = cancelLasso;
bar.querySelector(".undo").onclick = () => { const s = strokes.pop(); if (s) s.g.remove(); syncBar(); };
// ---- copy text from the screen: drag a box, and on release its text goes to the message box
let grabOn = false, grabIdx = 0, g0 = null, gEls = null;
window.grab = (on, i, hint) => {
  if (pickOn) window.pick(false);
  clearNow(); grabOn = on; grabIdx = i || 0; g0 = null;
  if (hint) document.querySelector("#gbar span").textContent = hint;
  document.body.classList.toggle("grab", on); document.body.classList.remove("dragging");
  if (!on) return;
  // the dim is a path with the box cut out (even-odd), so the box shows the screen at full strength
  gEls = { dim: el("path", { class: "dim", "fill-rule": "evenodd", d: dimPath() }, svg), box: el("rect", { class: "gbox", rx: 4, width: 0, height: 0 }, svg) };
};
function dimPath(x, y, w, h) {
  const W = innerWidth, H = innerHeight, outer = `M0 0H${W}V${H}H0Z`;
  return w ? `${outer}M${x} ${y}h${w}v${h}h${-w}Z` : outer;
}
function endGrab() { grabOn = false; g0 = null; document.body.classList.remove("grab", "dragging"); clearNow(); }
const cancelGrab = () => { if (grabOn) { endGrab(); window.pywebview.api.circle_cancel(); } };
document.querySelector("#gbar .cancel").onclick = cancelGrab;
const gRect = e => { const x = Math.min(g0[0], e.clientX), y = Math.min(g0[1], e.clientY); return [x, y, Math.abs(e.clientX - g0[0]), Math.abs(e.clientY - g0[1])]; };
addEventListener("mousedown", e => {
  if (!grabOn || e.button !== 0 || e.target.closest("#gbar")) return;
  g0 = [e.clientX, e.clientY]; document.body.classList.add("dragging");
});
addEventListener("mousemove", e => {
  if (!grabOn || !g0) return;
  const [x, y, w, h] = gRect(e);
  Object.entries({ x, y, width: w, height: h }).forEach(([k, v]) => gEls.box.setAttribute(k, v));
  gEls.dim.setAttribute("d", dimPath(x, y, w, h));
});
addEventListener("mouseup", e => {
  if (!grabOn || !g0 || e.button !== 0) return;
  const r = gRect(e);
  if (r[2] < 6 || r[3] < 6) { window.grab(true, grabIdx); return; }  // a click, not a box: start again
  const i = grabIdx; endGrab();
  window.pywebview.api.text_done(i, r);
});

addEventListener("mousedown", e => {
  if (!lassoOn || e.button !== 0 || e.target.closest("#bar")) return;
  drawing = true;
  const g = el("g", { class: "mark" }, svg);
  cur = { g, pts: [[e.clientX, e.clientY]], paths: [el("path", { class: "glow", stroke: COLORS.yellow }, g), el("path", { class: "ink", stroke: COLORS.yellow }, g)] };
  cur.paths.forEach(p => p.setAttribute("d", `M${e.clientX} ${e.clientY} l0.1 0`));
});
addEventListener("mousemove", e => {
  if (!drawing) return;
  const [lx, ly] = cur.pts[cur.pts.length - 1];
  if (Math.hypot(e.clientX - lx, e.clientY - ly) < 2.5) return;
  cur.pts.push([e.clientX, e.clientY]);
  const d = freePath(cur.pts); cur.paths.forEach(p => p.setAttribute("d", d));
});
addEventListener("mouseup", e => {
  if (!drawing || e.button !== 0) return;
  drawing = false; strokes.push(cur); cur = null; syncBar();
});
addEventListener("contextmenu", e => { e.preventDefault(); cancelLasso(); cancelGrab(); if (pickOn && !pk.classList.contains("sent")) cancelPick(); });
addEventListener("keydown", e => {
  if (e.key === "Escape") { cancelLasso(); cancelGrab(); if (pickOn && !pk.classList.contains("sent")) cancelPick(); }
  if (e.key === "Enter") finishLasso();
});

function fadeOut() {
  svg.querySelectorAll("g.mark").forEach(g => g.classList.add("gone"));
  setTimeout(clearNow, 700);
}
function clearNow() { svg.innerHTML = ""; }
window.clearMarks = () => { pickGone(); fadeOut(); };
</script>
</body>
</html>
