<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tether</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <aside id="side" class="pane">
    <div class="side-top pywebview-drag-region">
      <button id="new-btn" class="btn primary" title="New session (⌘N)">New session<span class="kbd">⌘N</span></button>
      <button id="search" class="search-box" title="Sessions, repos and actions (⌘K)">
        <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg><span>Search</span><span class="kbd">⌘K</span>
      </button>
    </div>
    <div id="side-list" class="scroll"></div>
    <div class="side-foot">
      <button id="archived-btn" class="btn ghost small">Archived</button>
      <div class="spacer"></div>
      <span id="keys-hint" class="mono dim"></span>
      <button id="settings-btn" class="icb" title="Settings (⌘,)">
        <svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
      </button>
    </div>
    <div id="ctx-menu" class="popup menu" hidden></div>
  </aside>

  <main id="main" class="pane">
    <header id="bar" class="pywebview-drag-region">
      <div id="bar-repo" class="bar-group"></div>
      <div class="spacer pywebview-drag-region"></div>
      <div id="bar-right" class="bar-group"></div>
      <div id="view-seg" class="seg glide" title="What the chat shows (⌘D)">
        <span class="thumb"></span>
        <button data-v="full">Full</button><button data-v="thinking">Thinking</button><button data-v="chat">Chat</button>
      </div>
      <button id="panel-btn" class="icb" title="Shelf, changes, notes and stats (⌘\)">
        <svg class="i" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M14.5 4.5v15"/></svg>
      </button>
    </header>
    <div id="chats"></div>
    <div id="empty" class="empty">
      <h1>Tether</h1>
      <div id="recent-repos"></div>
    </div>
    <footer id="composer" hidden>
      <button id="jump" hidden><span class="d"></span><span class="t">Working</span><svg viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></svg></button>
      <div id="perm-dock"></div>
      <div id="jobs-wrap"><button id="jobs-note" hidden></button><div id="jobs-pop" class="popup" hidden></div></div>
      <div id="slash" class="popup" hidden></div>
      <div class="composer-box pane">
        <div id="attachments"></div>
        <div class="compose-row">
          <textarea id="input" rows="1" placeholder="Message Claude" spellcheck="true"></textarea>
        </div>
        <div class="compose-tools">
          <button id="file-btn" class="tool-btn" title="Attach files (or drop them on the window)">
            <svg viewBox="0 0 24 24"><path d="M20 11.5 12.4 19a5 5 0 0 1-7.1-7.1l8-8a3.3 3.3 0 0 1 4.7 4.7l-8 8a1.7 1.7 0 0 1-2.4-2.4l7.3-7.3"/></svg>
          </button>
          <button id="mic-btn" class="tool-btn" title="Dictate (hold the voice key, or click to start and stop)">
            <svg viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3Z"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
            <span class="lvl"></span>
          </button>
          <div id="tools-wrap">
            <button id="tools-btn" class="tool-btn" title="Tools">
              <svg viewBox="0 0 24 24"><path d="M3.5 9.5h17v9a1.5 1.5 0 0 1-1.5 1.5H5a1.5 1.5 0 0 1-1.5-1.5v-9Z"/><path d="M9 9.5V6.5A1.5 1.5 0 0 1 10.5 5h3A1.5 1.5 0 0 1 15 6.5v3M3.5 13.5h17M10.5 13.5v1.5h3v-1.5"/></svg>
            </button>
            <div id="tools-menu" class="popup tools-menu" hidden></div>
          </div>
          <div class="spacer"></div>
          <div id="run-wrap">
            <button id="run-btn" class="run-chip" title="Model, effort and permission mode (⇧Tab cycles the mode)"><span class="lbl"></span><span class="chev-s"></span></button>
            <div id="run-menu" class="popup run-menu" hidden></div>
          </div>
          <select id="mode-sel" hidden>
            <option value="auto" title="Auto · Runs safe actions itself; a safety check stops risky ones">Auto</option>
            <option value="manual" title="Ask first · Asks before each edit and command">Ask first</option>
            <option value="acceptEdits" title="Accept edits · Edits files without asking; asks before commands">Accept edits</option>
            <option value="plan" title="Plan · Reads and plans only; no edits or commands">Plan</option>
            <option value="dontAsk" title="Don't ask · Runs only what your settings allow; skips the rest">Don't ask</option>
            <option value="bypassPermissions" title="Bypass permissions · Runs everything without asking">Bypass permissions</option>
          </select>
          <select id="model-sel" hidden></select>
          <select id="effort-sel" hidden>
            <option value="">Default effort</option>
            <option value="low">Low</option><option value="medium">Medium</option>
            <option value="high">High</option><option value="xhigh">Extra high</option><option value="max">Max</option>
          </select>
          <button id="fast-btn" class="fast-btn" title="Fast mode: same model, faster output">Fast</button>
          <button id="send-btn" class="round-btn send" title="Send (Enter)"><svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
          <button id="stop-btn" class="round-btn stop" title="Stop (Esc)" hidden><i></i></button>
        </div>
      </div>
    </footer>
  </main>

  <aside id="panel" class="pane" hidden>
    <div id="panel-grip" title="Drag to resize"></div>
    <div class="panel-head pywebview-drag-region">
      <div class="tabs pywebview-drag-region">
        <button data-tab="view" class="tab on" title="Shelf (⌘J)" hidden>Shelf</button>
        <button data-tab="changes" class="tab">Changes</button>
        <button data-tab="history" class="tab">History</button>
        <button data-tab="notes" class="tab">Notes</button>
        <button data-tab="stats" class="tab">Stats</button>
      </div>
      <div class="spacer pywebview-drag-region"></div>
      <button id="panel-refresh" class="icb" title="Refresh"><svg class="i" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6"/></svg></button>
    </div>
    <div id="pr-card"></div>
    <div id="panel-body" class="scroll"></div>
  </aside>
</div>

<div id="peek" class="pop" tabindex="-1" hidden>
  <div class="peek-h"><span class="peek-t"></span><span class="peek-m"></span><span class="spacer"></span>
    <div class="seg peek-mode" hidden><button data-pm="page">Page</button><button data-pm="code">Code</button></div>
    <button class="icb" data-peek="panel" title="Open in panel"><svg class="i" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M14.5 4.5v15M17 9h1M17 12h1"/></svg></button>
    <button class="icb" data-peek="grow" title="Larger (Space)"><svg class="i" viewBox="0 0 24 24"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/></svg></button>
    <button class="btn small" data-peek="open">Open</button>
    <button class="icb" data-peek="close" title="Close (Esc)"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <div class="peek-b"></div>
</div>
<div id="palette-scrim" hidden></div>
<div id="palette" class="pop" hidden>
  <div class="pal-in"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg><input id="pal-q" placeholder="Search sessions, repos and actions" spellcheck="false"></div>
  <div id="pal-res"></div>
</div>
<div id="dropzone" hidden>Drop to attach</div>
<div id="modal" hidden><div class="modal-box"></div></div>
<div id="toast"></div>
<div id="circling" hidden>Draw on the screen. Return to explain, Esc to cancel.</div>
<script src="markdown.js"></script>
<script src="repo-panel.js"></script>
<script src="runner.js"></script>
<script src="critters.js"></script>
<script src="app.js"></script>
</body>
</html>
