<script>
(() => {
  const { $, el, esc, toast, menu, ask, touch, call } = Desk;
  const page = $("#page");
  const ex = (c, v) => { page.focus(); document.execCommand(c, false, v); after(); };
  const px = v => Math.round(v) + "px";

  // ----- only plain document HTML ever goes on the page (files, pastes and Claude's edits all pass through here)
  const INLINE = new Set(["B", "STRONG", "I", "EM", "U", "S", "STRIKE", "DEL", "SUB", "SUP", "CODE", "MARK", "SPAN", "FONT", "A"]);
  const BLOCK = new Set(["P", "DIV", "H1", "H2", "H3", "H4", "UL", "OL", "LI", "BLOCKQUOTE", "PRE", "TABLE", "THEAD", "TBODY", "TFOOT", "TR", "TD", "TH", "BR", "HR", "IMG"]);
  const cssOk = (el, tag) => {

    if (!s) return "";
    if (!INLINE.has(tag)) { if (/^(center|right|justify)$/.test(s.textAlign)) out.push(`text-align:${s.textAlign}`); return out.join(";"); }

  function clean(html) {
    const src = new DOMParser().parseFromString(`<body>${html}</body>`, "text/html"), out = document.createElement("div");

        if (tag === "IMG") { const s = n.getAttribute("src") || ""; if (!/^data:image\/(png|jpeg|jpg|gif);base64,/i.test(s)) continue; e.setAttribute("src", s); const w = parseInt(n.getAttribute("width") || n.style.width); if (w > 0) e.setAttribute("width", Math.min(1200, w));
          if (n.classList.contains("free")) { const x = parseFloat(n.style.left), y = parseFloat(n.style.top); if (isFinite(x) && isFinite(y)) { e.className = "free"; e.style.left = px(Math.max(-2000, Math.min(2000, x))); e.style.top = px(Math.max(-20000, Math.min(20000, y))); } } }
        if (tag === "HR" && n.classList.contains("page-break")) e.className = "page-break";
        if ((tag === "TD" || tag === "TH") && +n.getAttribute("colspan") > 1) e.setAttribute("colspan", +n.getAttribute("colspan"));
        walk(n, e); to.appendChild(e);
      }

  }
  // ----- Markdown and plain text, in and out
  const inlineMd = t => esc(t).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/(^|[^*\w])\*([^*\s][^*]*)\*/g, "$1<i>$2</i>").replace(/(^|[^_\w])_([^_\s][^_]*)_(?!\w)/g, "$1<i>$2</i>")
    .replace(/~~([^~]+)~~/g, "<s>$1</s>").replace(/\[([^\]]+)\]\((https?:[^)\s]+|mailto:[^)\s]+)\)/g, '<a href="$2">$1</a>');
  function fromMd(md) {
    const L = String(md).replace(/\r/g, "").split("\n"), out = []; let i = 0;
    const list = (ordered, indent) => { const tag = ordered ? "ol" : "ul"; let h = `<${tag}>`;
      while (i < L.length) { const m = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/.exec(L[i]); if (!m || m[1].length < indent) break;
        if (m[1].length > indent) { h = h.replace(/<\/li>$/, "") + list(/\d/.test(m[2]), m[1].length) + "</li>"; continue; }
        if (/\d/.test(m[2]) !== ordered) break;
        h += `<li>${inlineMd(m[3])}</li>`; i++; }
      return h + `</${tag}>`; };
    while (i < L.length) {
      const l = L[i];
      if (!l.trim()) { i++; continue; }
      let m;
      if (/^```/.test(l)) { const b = []; i++; while (i < L.length && !/^```/.test(L[i])) b.push(L[i++]); i++; out.push(`<pre>${esc(b.join("\n"))}</pre>`); }
      else if ((m = /^(#{1,6})\s+(.*)$/.exec(l))) { const n = Math.min(4, m[1].length); out.push(`<h${n}>${inlineMd(m[2])}</h${n}>`); i++; }
      else if (/^\s*([-*_])\s*(\1\s*){2,}$/.test(l)) { out.push("<hr>"); i++; }
      else if (/^>\s?/.test(l)) { const b = []; while (i < L.length && /^>\s?/.test(L[i])) b.push(L[i++].replace(/^>\s?/, "")); out.push(`<blockquote>${inlineMd(b.join(" "))}</blockquote>`); }
      else if (/^\s*([-*+]|\d+[.)])\s+/.test(l)) out.push(list(/^\s*\d/.test(l), /^(\s*)/.exec(l)[1].length));
      else if (/^\|.*\|\s*$/.test(l) && /^\|[\s:|-]+\|\s*$/.test(L[i + 1] || "")) { const rows = []; while (i < L.length && /^\|.*\|\s*$/.test(L[i])) { if (!/^\|[\s:|-]+\|\s*$/.test(L[i])) rows.push(L[i].trim().slice(1, -1).split("|").map(c => c.trim())); i++; }

      else { const b = []; while (i < L.length && L[i].trim() && !/^(#{1,6}\s|```|>\s?|\s*([-*+]|\d+[.)])\s+)/.test(L[i])) b.push(L[i++]); out.push(`<p>${inlineMd(b.join(" "))}</p>`); }
    }

  }
  function toMd(root) {
    const inl = n => [...n.childNodes].map(c => { if (c.nodeType === 3) return c.nodeValue.replace(/\s+/g, " "); if (c.nodeType !== 1) return ""; const t = c.tagName, s = inl(c);
      if (t === "BR") return "\n"; if (t === "IMG") return "(picture)"; if (!s.trim()) return s;
      if (t === "B" || t === "STRONG") return `**${s.trim()}**`; if (t === "I" || t === "EM") return `*${s.trim()}*`; if (t === "CODE") return "`" + s + "`"; if (t === "S" || t === "DEL" || t === "STRIKE") return `~~${s}~~`;

      if (c.nodeType === 3) return c.nodeValue.trim() ? c.nodeValue.trim() + "\n\n" : "";

      if (/^H[1-4]$/.test(t)) return "#".repeat(+t[1]) + " " + inl(c).trim() + "\n\n";

        return "  ".repeat(depth) + (t === "OL" ? `${k + 1}. ` : "- ") + inl(own).trim() + "\n" + sub.map(s => blocks({ childNodes: [s] }, depth + 1)).join(""); }).join("") + (depth ? "" : "\n");

      if (t === "PRE") return "```\n" + c.textContent.replace(/\n$/, "") + "\n```\n\n";
      if (t === "HR") return "---\n\n";
      if (t === "TABLE") { const rows = [...c.querySelectorAll("tr")].map(r => [...r.children].map(x => inl(x).trim().replace(/\|/g, "\\|").replace(/\n/g, " "))); if (!rows.length) return "";
        return "| " + rows[0].join(" | ") + " |\n|" + rows[0].map(() => " --- |").join("") + "\n" + rows.slice(1).map(r => "| " + r.join(" | ") + " |\n").join("") + "\n"; }
      if (t === "P" || t === "DIV") { const s = inl(c).trim(); return s ? s + "\n\n" : ""; }
      return inl(c);
    }).join("");

  }
  const fromText = t => String(t).replace(/\r/g, "").split(/\n{2,}/).map(p => `<p>${esc(p).replace(/\n/g, "<br>")}</p>`).join("") || "";

  // ----- the page
  function setAll(html) { page.innerHTML = clean(html || ""); $("#scroll").scrollTop = 0; after(true); }
  // Claude's edits replace parts of the page directly, so the editor's own undo can't take them back: this line can
  function byClaude(before) {
    document.querySelectorAll(".notice.claude").forEach(n => n.remove());
    const n = el("div", "notice claude", `<span>Claude changed this document.</span><span class="sp"></span><button class="btn" data-a="undo">Undo its change</button><button class="btn quiet" data-a="ok">Keep</button>`);
    n.querySelector("[data-a=undo]").onclick = () => { page.innerHTML = before; n.remove(); after(); };
    n.querySelector("[data-a=ok]").onclick = () => n.remove();
    $(".bar").after(n);
  }
  let footT = 0;
  function after(noTouch) { if (!noTouch) touch(); clearTimeout(footT); footT = setTimeout(foot, 120); marks(); picUndo = null; frame(); }
  function foot() {
    const t = plain().trim(), w = t ? t.split(/\s+/).length : 0;
    $("#words").textContent = `${w.toLocaleString("en-US")} word${w === 1 ? "" : "s"} · ${t.length.toLocaleString("en-US")} characters`;
  }
  const blockOf = () => { let n = getSelection().anchorNode; while (n && n !== page) { if (n.nodeType === 1 && /^(P|H[1-4]|BLOCKQUOTE|PRE|LI|TD|TH|DIV)$/.test(n.tagName)) return n; n = n.parentNode; } return null; };
  const cellOf = () => { let n = getSelection().anchorNode; while (n && n !== page) { if (n.nodeType === 1 && /^(TD|TH)$/.test(n.tagName)) return n; n = n.parentNode; } return null; };
  function marks() {  // light the buttons that match where the cursor is
    if (!page.contains(getSelection().anchorNode)) return;
    document.querySelectorAll(".ib[data-c]").forEach(b => { if (!/undo|redo/.test(b.dataset.c)) { let on = false; try { on = document.queryCommandState(b.dataset.c); } catch (e) {} b.classList.toggle("on", on); } });
    const b = blockOf(), t = b ? b.tagName.toLowerCase() : "p";

    $("#where").textContent = cellOf() ? "In a table" : "";
  }
  document.addEventListener("selectionchange", marks);
  page.addEventListener("input", () => after());
  document.querySelectorAll(".ib[data-c]").forEach(b => { b.onmousedown = e => e.preventDefault(); b.onclick = () => { if (b.dataset.c === "undo" && undoPic()) return; ex(b.dataset.c); }; });
  $("#block").onchange = e => {  // a heading can't sit inside a list item: take the line out of its list first
    const b = blockOf(), li = b?.closest?.("li");

  };
  const keepSel = b => { b.onmousedown = e => e.preventDefault(); };
  ["#color", "#align", "#link", "#insert"].forEach(s => keepSel($(s)));
  $("#color").onclick = () => {
    const css = () => document.execCommand("styleWithCSS", false, true);
    const m = menu($("#color"), [{ head: "Text" },
      ...[["Default", ""], ["Red", "#C62828"], ["Orange", "#C2410C"], ["Green", "#1B7F3B"], ["Blue", "#1565C0"], ["Purple", "#6A1B9A"], ["Gray", "#6B7780"]].map(([n, c]) => ({ label: n, swatch: c || "var(--text)", run: () => { css(); ex("foreColor", c || getComputedStyle(page).color); } })),
      { head: "Highlight" },
      ...[["Yellow", "#FFF59D"], ["Green", "#B9F6CA"], ["Blue", "#BBDEFB"], ["Pink", "#F8BBD0"]].map(([n, c]) => ({ label: n, swatch: c, run: () => { css(); if (!document.execCommand("hiliteColor", false, c)) document.execCommand("backColor", false, c); document.execCommand("foreColor", false, "#10181C"); after(); } })),
      { label: "No highlight", run: () => { css(); if (!document.execCommand("hiliteColor", false, "transparent")) document.execCommand("backColor", false, "transparent"); document.execCommand("foreColor", false, getComputedStyle(page).color); after(); } }]);
    m.onmousedown = e => e.preventDefault();
  };
  $("#align").onclick = () => { const m = menu($("#align"), [["Left", "justifyLeft"], ["Center", "justifyCenter"], ["Right", "justifyRight"], ["Justified", "justifyFull"]].map(([n, c]) => ({ label: n, run: () => ex(c) })).concat(["-", { label: "Indent", key: "Tab", run: () => ex("indent") }, { label: "Outdent", key: "⇧Tab", run: () => ex("outdent") }])); m.onmousedown = e => e.preventDefault(); };

    const rg = sel.getRangeAt(0).cloneRange(); let a = sel.anchorNode; while (a && a !== page && a.tagName !== "A") a = a.parentNode;
    const url = await ask("Link address", [["Cancel", null], ...(a?.tagName === "A" ? [["Remove link", "none"]] : []), ["Add link", true, "primary"]], a?.tagName === "A" ? a.getAttribute("href") : "https://");
    page.focus(); sel.removeAllRanges(); sel.addRange(rg);
    if (url === "none") return ex("unlink");
    if (!url || !/^(https?:\/\/|mailto:)\S+/i.test(url.trim())) { if (url) toast("A link needs to start with https:// or mailto:"); return; }
    if (rg.collapsed) ex("insertHTML", `<a href="${esc(url.trim())}">${esc(url.trim())}</a>`); else ex("createLink", url.trim());
  }
  $("#link").onclick = link;
  const tableHtml = (r, c) => "<table>" + Array.from({ length: r }, (_, y) => "<tr>" + Array.from({ length: c }, () => y ? "<td><br></td>" : "<th><br></th>").join("") + "</tr>").join("") + "</table><p><br></p>";
  $("#insert").onclick = () => {
    const td = cellOf(), tr = td?.parentNode, tb = td?.closest("table");
    const m = menu($("#insert"), [
      { label: "Table, 2 × 2", run: () => ex("insertHTML", tableHtml(2, 2)) }, { label: "Table, 3 × 3", run: () => ex("insertHTML", tableHtml(3, 3)) }, { label: "Table, 4 × 5", run: () => ex("insertHTML", tableHtml(4, 5)) },

  // ----- pictures: click one to select it, drag it anywhere on the page, drag a corner to resize it.

  document.addEventListener("keydown", e => {
    if ((e.metaKey || e.ctrlKey) && !e.shiftKey && e.key.toLowerCase() === "z" && picUndo) { e.preventDefault(); e.stopPropagation(); undoPic(); return; }

  page.addEventListener("beforeinput", e => {

  // the words on the page as plain text (innerText is empty while the Desk is on another editor, so not that)
  const plain = () => { const d = page.cloneNode(true); d.querySelectorAll("br").forEach(b => b.replaceWith("\n")); d.querySelectorAll("td,th").forEach(c => c.append("\t"));

    types: [["Word document", "docx"], ["Web page", "html"], ["Markdown", "md"], ["Plain text", "txt"]],
    canSave: ext => [".docx", ".html", ".htm", ".md", ".txt"].includes(ext),
    blank() { setAll(""); },
    load(r) { setAll(r.html != null ? r.html : /\.html?$/i.test(r.name) ? r.text : /\.(md|markdown)$/i.test(r.name) ? fromMd(r.text) : fromText(r.text)); },
    dump(ext) { return ext === ".md" ? { text: toMd(page) } : ext === ".txt" ? { text: plain() } : { html: clean(page.innerHTML), text: plain() }; },
    draft() { const d = Desk.doc; return { doc: { path: d.path, name: d.name, dirty: d.dirty, mtime: d.mtime }, paths: d.path ? [d.path] : [], html: page.innerHTML.length < 6000000 ? page.innerHTML : null }; },
    async restore(d) {

    read(a) {
      const as = a.as || "markdown";

    },

      const add = a.append_html != null ? String(a.append_html) : a.append_markdown != null ? fromMd(a.append_markdown) : null;

        if (hits.length > 1 && !a.all) return { error: `That text appears ${hits.length} times. Give more of it so it matches once, or pass all: true.` };

})();
