<script>

  const raw = (x, y) => { const v = jx.getValueFromCoords(x, y); return v == null ? "" : String(v); };

    const [x1, y1, x2, y2] = sel;

    .concat(["-", { label: "No highlight", run: () => { const o = {}, t = {}; for (const k of cellsOf()) { o[k] = "background-color: transparent"; t[k] = "color: inherit"; } jx.setStyle(o); jx.setStyle(t); touch(); } }]));

    { label: "Insert column left", run: () => jx.insertColumn(1, sel[0], true) }, { label: "Insert column right", run: () => jx.insertColumn(1, sel[2], false) }, "-",

    },

    state() { keep(); return { sheets: sheets.map((s, i) => { const [r, c] = used(s.data); return { name: s.name, rows: r, columns: c, in_front: i === at }; }), selection: $("#cell").value }; },
    read(a) {

      if (i < 0) return { error: `No sheet called ${a.sheet}. Sheets: ${sheets.map(s => s.name).join(", ")}.` };
      const s = sheets[i], [ur, uc] = used(s.data);
      let rg = a.range ? parseRange(a.range) : [0, 0, Math.max(0, uc - 1), Math.max(0, ur - 1)];
      if (!rg) return { error: "Give the range like A1:D20." };
      const full = rg[3] - rg[1] + 1; rg[3] = Math.min(rg[3], rg[1] + 299); rg[2] = Math.min(rg[2], rg[0] + 59);
      const cells = [], values = []; let formulas = false;
      for (let y = rg[1]; y <= rg[3]; y++) { const row = [], vr = []; for (let x = rg[0]; x <= rg[2]; x++) { const v = s.data[y]?.[x] ?? ""; row.push(v); if (String(v).startsWith("=")) formulas = true; vr.push(i === at && jx ? shownVal(x, y) : v); } cells.push(row); values.push(vr); }
      return { sheet: s.name, used_range: ur ? `A1:${ref(uc - 1, ur - 1)}` : "empty", range: `${ref(rg[0], rg[1])}:${ref(rg[2], rg[3])}`, cells, ...(formulas && i === at ? { results: values } : {}),
        ...(full > 300 ? { note: `Showing 300 of ${full} rows; ask for the next range.` } : {}) };
    },
    write(a) {
      if (a.add_sheet) { keep(); sheets.push(blankSheet(unique(String(a.add_sheet).slice(0, 31)))); at = sheets.length - 1; sel = [0, 0, 0, 0]; draw(); }
      if (a.sheet) { const i = sheets.findIndex(s => s.name.toLowerCase() === String(a.sheet).toLowerCase()); if (i < 0) return { error: `No sheet called ${a.sheet}. Sheets: ${sheets.map(s => s.name).join(", ")}. Use add_sheet to make one.` }; if (i !== at) goSheet(i); }
      if (a.rename_sheet) { sheets[at].name = unique(String(a.rename_sheet).replace(/[\\/?*[\]:]/g, " ").slice(0, 31)); drawSheets(); }
      const sets = [];  // [x, y, value]
      if (a.rows) { const o = parseRef(a.at || "A1"); if (!o) return { error: "Give `at` like A1." }; a.rows.forEach((row, dy) => (Array.isArray(row) ? row : [row]).forEach((v, dx) => sets.push([o[0] + dx, o[1] + dy, v]))); }
      for (const [k, v] of Object.entries(a.cells || {})) { const p = parseRef(k); if (!p) return { error: `${k} isn't a cell like B2.` }; sets.push([p[0], p[1], v]); }
      if (a.clear) { const rg = parseRange(a.clear); if (!rg) return { error: "Give `clear` like A1:C5." }; for (let y = rg[1]; y <= rg[3]; y++) for (let x = rg[0]; x <= rg[2]; x++) sets.push([x, y, ""]); }
      if (sets.length) {
        const mx = Math.max(...sets.map(s => s[0])), my = Math.max(...sets.map(s => s[1]));
        if (mx >= MAXC || my >= MAXR) return { error: `Ledger holds up to ${MAXR} rows and ${MAXC} columns.` };
        const d = jx.getData(), rows = d.length, cols = d[0].length;
        if (my >= rows || mx >= cols) {  // grow the grid first
          keep(); const s = sheets[at]; while (s.data.length <= my) s.data.push([]); s.data = s.data.map(r => { const n = r.slice(); while (n.length <= mx) n.push(""); return n; });
          for (const [x, y, v] of sets) s.data[y][x] = v == null ? "" : String(v);
          draw();
        } else for (const [x, y, v] of sets) jx.setValueFromCoords(x, y, v == null ? "" : String(v), true);
        const [x, y] = sets[0]; try { jx.updateSelectionFromCoords(x, y, x, y); } catch (e) {}
      }
      if (a.bold) { const rg = parseRange(a.bold); if (rg) { const o = {}; for (let y = rg[1]; y <= rg[3]; y++) for (let x = rg[0]; x <= rg[2]; x++) o[ref(x, y)] = "font-weight: bold"; jx.setStyle(o); } }
      if (a.widths) for (const [k, w] of Object.entries(a.widths)) { const x = colIdx(k); if (x >= 0 && +w > 20) jx.setWidth(x, Math.min(600, +w)); }
      if (!sets.length && !a.add_sheet && !a.sheet && !a.rename_sheet && !a.bold && !a.widths) return { error: "Pass cells ({\"B2\": \"=SUM(A1:A9)\"}), rows with at, clear, add_sheet, rename_sheet, bold or widths." };
      foot(); onSel();
      return { ok: true, sheet: sheets[at].name, cells_set: sets.length };
    },
    onTheme() {},
  });
})();
</script>
